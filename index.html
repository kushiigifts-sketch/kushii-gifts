/* =========================================================
   KUSHII GIFTS
   BRAND DESIGN SYSTEM
========================================================= */

:root {

    /* Primary brand colours */
    --blush: #F3D9DC;
    --sage: #B8D2C5;
    --ivory: #FFF9F2;
    --rose: #D98C9C;
    --charcoal: #292727;

    /* Supporting colours */
    --rose-dark: #C87587;
    --sage-dark: #91B9A7;
    --cream-dark: #F5EAE4;
    --muted: #766F70;
    --white: #FFFFFF;

    /* Functional */
    --whatsapp: #25D366;

    /* Shadows */
    --shadow:
        0 4px 18px rgba(73, 55, 58, 0.08);

    --shadow-hover:
        0 8px 25px rgba(73, 55, 58, 0.13);
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: var(--ivory);

    color: var(--charcoal);
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: sticky;

    top: 0;

    z-index: 1000;

    height: 72px;

    background:
        rgba(255, 249, 242, 0.96);

    display: flex;

    align-items: center;

    padding: 0 20px;

    box-shadow:
        0 1px 10px rgba(73, 55, 58, 0.06);

    backdrop-filter: blur(10px);
}


.logo {

    width: 46px;

    height: 46px;

    border-radius: 50%;

    background: var(--blush);

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(217, 140, 156, 0.35);

    font-size: 22px;
}


.brand {

    margin-left: 12px;

    font-size: 22px;

    font-weight: 800;

    color: var(--charcoal);
}


.brand span {

    color: var(--rose);
}


/* =========================================================
   HERO
========================================================= */

.hero {

    background:
        linear-gradient(
            135deg,
            var(--blush) 0%,
            var(--ivory) 55%,
            var(--cream-dark) 100%
        );

    text-align: center;

    padding:
        40px
        20px
        32px;

    border-bottom:
        1px solid
        rgba(217, 140, 156, 0.18);
}


.hero-logo {

    width: 90px;

    height: 90px;

    margin: auto;

    border-radius: 50%;

    background: var(--ivory);

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        2px solid
        rgba(217, 140, 156, 0.35);

    font-size: 38px;

    box-shadow: var(--shadow);
}


.hero h1 {

    margin:
        18px
        0
        8px;

    font-size: 34px;

    color: var(--charcoal);

    letter-spacing: -0.5px;
}


.hero p {

    margin: 0;

    color: var(--muted);

    font-size: 16px;

    line-height: 1.5;
}


/* =========================================================
   SEARCH
========================================================= */

.search-wrapper {

    max-width: 1000px;

    margin:
        25px
        auto
        10px;

    padding:
        0
        18px;
}


.search {

    width: 100%;

    height: 58px;

    border-radius: 30px;

    border:
        1px solid
        #E8D9D5;

    background: var(--white);

    padding:
        0
        24px;

    font-size: 17px;

    color: var(--charcoal);

    outline: none;

    box-shadow: var(--shadow);
}


.search::placeholder {

    color: #9A9091;
}


.search:focus {

    border-color: var(--rose);

    box-shadow:
        0 0 0 3px
        rgba(217, 140, 156, 0.12);
}


/* =========================================================
   CATEGORIES
========================================================= */

.categories {

    display: flex;

    gap: 10px;

    overflow-x: auto;

    padding:
        15px
        18px;

    max-width: 1100px;

    margin: auto;

    scrollbar-width: none;
}


.categories::-webkit-scrollbar {

    display: none;
}


.category-btn {

    flex-shrink: 0;

    border:
        1px solid
        #E5DAD6;

    background: var(--white);

    border-radius: 22px;

    padding:
        10px
        18px;

    cursor: pointer;

    font-weight: 600;

    color: var(--charcoal);

    transition:
        all
        .15s
        ease;
}


.category-btn:hover {

    border-color: var(--rose);

    color: var(--rose-dark);
}


.category-btn.active {

    background: var(--rose);

    color: var(--white);

    border-color: var(--rose);

    box-shadow:
        0 3px 10px
        rgba(217, 140, 156, 0.22);
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    max-width: 1150px;

    margin: auto;

    padding:
        10px
        18px
        140px;
}


.catalogue-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin:
        20px
        0;
}


.catalogue-title h2 {

    margin: 0;

    font-size: 23px;

    color: var(--charcoal);
}


.product-count {

    color: var(--muted);

    font-size: 14px;
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.products {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0, 1fr)
        );

    gap: 18px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card {

    background: var(--white);

    border-radius: 16px;

    overflow: hidden;

    box-shadow: var(--shadow);

    display: flex;

    flex-direction: column;

    transition:
        transform
        .18s
        ease,
        box-shadow
        .18s
        ease;
}


.product-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        var(--shadow-hover);
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    background:
        linear-gradient(
            135deg,
            var(--blush),
            var(--ivory)
        );
}


/* =========================================================
   PRODUCT INFORMATION
========================================================= */

.product-info {

    padding: 14px;
}


.product-name {

    font-size: 16px;

    font-weight: 700;

    line-height: 1.3;

    min-height: 42px;

    color: var(--charcoal);
}


.product-meta {

    color: var(--rose-dark);

    font-size: 13px;

    font-weight: 600;

    margin-top: 5px;
}


.product-description {

    font-size: 13px;

    line-height: 1.45;

    color: var(--muted);

    margin-top: 7px;

    min-height: 38px;
}


.product-price {

    font-size: 19px;

    font-weight: 800;

    margin-top: 10px;

    color: var(--rose-dark);
}


.moq {

    font-size: 12px;

    color: var(--muted);

    margin-top: 3px;
}


/* =========================================================
   ADD TO CART
========================================================= */

.add-button {

    width: 100%;

    margin-top: 12px;

    height: 42px;

    border-radius: 10px;

    border:
        1px solid
        var(--rose);

    background: var(--white);

    color: var(--rose-dark);

    font-weight: 800;

    cursor: pointer;

    transition:
        all
        .15s
        ease;
}


.add-button:hover {

    background: var(--rose);

    color: var(--white);

    border-color: var(--rose);
}


.add-button.added {

    background: var(--rose);

    color: var(--white);

    border-color: var(--rose);
}


/* =========================================================
   CART BAR
========================================================= */

.cart-bar {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 2000;

    background: var(--sage);

    color: var(--charcoal);

    padding:
        12px
        18px;

    box-shadow:
        0 -4px 18px
        rgba(73, 55, 58, 0.12);

    display: flex;

    justify-content: center;
}


.cart-inner {

    width: 100%;

    max-width: 1100px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


.cart-summary {

    display: flex;

    gap: 20px;

    align-items: center;
}


.cart-items {

    font-weight: 700;

    font-size: 16px;
}


.cart-total {

    font-size: 20px;

    font-weight: 900;
}


.view-cart {

    border: 0;

    background: var(--rose);

    color: var(--white);

    border-radius: 9px;

    padding:
        13px
        22px;

    font-weight: 900;

    cursor: pointer;

    font-size: 15px;

    transition:
        transform
        .15s
        ease,
        background
        .15s
        ease;
}


.view-cart:hover {

    background: var(--rose-dark);

    transform:
        translateY(-1px);
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(
            41,
            39,
            39,
            0.42
        );

    z-index: 3000;
}


.overlay.show {

    display: block;
}


/* =========================================================
   CART DRAWER
========================================================= */

.cart-drawer {

    position: fixed;

    right: 0;

    top: 0;

    bottom: 0;

    width:
        min(
            520px,
            100%
        );

    background: var(--ivory);

    z-index: 3100;

    transform:
        translateX(100%);

    transition:
        transform
        .25s
        ease;

    display: flex;

    flex-direction: column;
}


.cart-drawer.open {

    transform:
        translateX(0);
}


/* =========================================================
   CART HEADER
========================================================= */

.cart-header {

    background: var(--white);

    padding: 20px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom:
        1px solid
        #E8DCD8;
}


.cart-header h2 {

    margin: 0;

    color: var(--charcoal);
}


.close-cart {

    border: 0;

    background: var(--blush);

    color: var(--charcoal);

    width: 38px;

    height: 38px;

    border-radius: 50%;

    cursor: pointer;

    font-size: 20px;
}


/* =========================================================
   CART BODY
========================================================= */

.cart-body {

    overflow-y: auto;

    flex: 1;

    padding: 16px;
}


.minimum-order {

    background: var(--blush);

    border:
        1px solid
        rgba(
            217,
            140,
            156,
            0.30
        );

    padding: 15px;

    border-radius: 12px;

    margin-bottom: 15px;

    font-size: 14px;

    font-weight: 600;

    color: var(--charcoal);

    line-height: 1.45;
}


/* =========================================================
   CART ITEM
========================================================= */

.cart-item {

    background: var(--white);

    border-radius: 12px;

    padding: 12px;

    margin-bottom: 12px;

    display: flex;

    gap: 12px;

    box-shadow: var(--shadow);
}


.cart-item img {

    width: 75px;

    height: 75px;

    object-fit: cover;

    border-radius: 8px;

    background: var(--blush);
}


.cart-item-details {

    flex: 1;
}


.cart-item-name {

    font-weight: 700;

    color: var(--charcoal);
}


.cart-item-price {

    color: var(--muted);

    font-size: 13px;

    margin-top: 4px;
}


/* =========================================================
   QUANTITY
========================================================= */

.quantity-control {

    display: flex;

    align-items: center;

    margin-top: 8px;

    gap: 4px;
}


.quantity-control button {

    width: 34px;

    height: 34px;

    border:
        1px solid
        #E5DAD6;

    background: var(--blush);

    color: var(--charcoal);

    cursor: pointer;

    font-size: 18px;

    border-radius: 7px;
}


.quantity-control span {

    width: 42px;

    text-align: center;

    font-weight: 700;
}


.remove {

    color: var(--rose-dark);

    border: 0;

    background: none;

    margin-top: 6px;

    cursor: pointer;

    padding: 0;

    font-weight: 600;
}


/* =========================================================
   CART FOOTER
========================================================= */

.cart-footer {

    background: var(--white);

    padding: 18px;

    border-top:
        1px solid
        #E5DAD6;
}


.total-row {

    display: flex;

    justify-content: space-between;

    font-size: 21px;

    font-weight: 900;

    margin-bottom: 15px;

    color: var(--charcoal);
}


/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp-button {

    width: 100%;

    height: 54px;

    border: 0;

    border-radius: 10px;

    background: var(--whatsapp);

    color: var(--white);

    font-size: 17px;

    font-weight: 900;

    cursor: pointer;

    transition:
        background
        .15s
        ease,
        transform
        .15s
        ease;
}


.whatsapp-button:hover {

    background: #20B957;

    transform:
        translateY(-1px);
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty {

    grid-column: 1 / -1;

    text-align: center;

    padding:
        70px
        20px;

    color: var(--muted);
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position: fixed;

    left: 50%;

    bottom: 90px;

    transform:
        translateX(-50%)
        translateY(20px);

    background: var(--charcoal);

    color: var(--white);

    padding:
        12px
        18px;

    border-radius: 25px;

    opacity: 0;

    pointer-events: none;

    transition: .25s;

    z-index: 5000;
}


.toast.show {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .products {

        grid-template-columns:
            repeat(
                3,
                minmax(0, 1fr)
            );
    }

}


@media (max-width: 650px) {

    .header {

        height: 62px;

        padding:

            15px;
    }


    .brand {

        font-size: 19px;
    }


    .hero {

        padding-top: 25px;
    }

        font-size: 28px;
    }


    .products {

        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );

        gap: 12px;
    }


    .product-info {

        padding: 11px;
    }


    .product-name {

        font-size: 14px;

        min-height: 38px;
    }


    .product-description {

        font-size: 12px;

        min-height: 48px;
    }


    .product-price {

        font-size: 17px;
    }


    .cart-summary {

        gap: 10px;
    }


    .cart-total {

        font-size: 16px;
    }


    .view-cart {

        padding:
            11px
            14px;
    }

}


@media (max-width: 380px) {

    .products {

        grid-template-columns:
            1fr 1fr;
    }


    .cart-items {

        font-size: 13px;
    }


    .cart-total {

        display: none;
    }

}


/* =========================================================
   SMALL BRAND DETAILS
========================================================= */

::selection {

    background: var(--blush);

    color: var(--charcoal);
}

</style>

/* =========================================================
   CART STATE
========================================================= */

let cart =
    JSON.parse(
        localStorage.getItem("kushiiCart")
    ) || {};

let selectedCategory = "All";


/* =========================================================
   CATEGORIES
========================================================= */

const categories = [

    "All",

    ...new Set(
        products.map(
            product =>
                product.category
        )
    )

];


function renderCategories() {

    const container =
        document.getElementById(
            "categoryButtons"
        );

    container.innerHTML = "";


    categories.forEach(category => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "category-btn " +
            (
                category === selectedCategory
                    ? "active"
                    : ""
            );


        button.textContent =
            category;


        button.onclick = () => {

            selectedCategory =
                category;

            renderCategories();

            renderProducts();

        };


        container.appendChild(
            button
        );

    });

}


/* =========================================================
   PRODUCTS
========================================================= */

function renderProducts() {

    const container =
        document.getElementById(
            "products"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const filtered =
        products.filter(
            product => {

                const matchesCategory =
                    selectedCategory === "All" ||
                    product.category ===
                        selectedCategory;


                const searchableText =
                    (
                        product.name +
                        " " +
                        product.category +
                        " " +
                        product.description
                    ).toLowerCase();


                const matchesSearch =
                    searchableText.includes(
                        search
                    );


                return (
                    matchesCategory &&
                    matchesSearch
                );

            }
        );


    document.getElementById(
        "productCount"
    ).textContent =
        `${filtered.length} products`;


    container.innerHTML = "";


    if (
        filtered.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    No products found
                </h3>

                <p>
                    Try another search.
                </p>

            </div>

        `;

        return;
    }


    filtered.forEach(
        product => {

            const quantity =
                cart[product.id] ||
                0;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product-card";


            card.innerHTML = `

                <img
                    class="product-image"
                    src="${product.image}"
                    alt="${product.name}"
                    onerror="
                        this.style.background='var(--blush)';
                    "
                >


                <div class="product-info">


                    <div class="product-name">
                        ${product.name}
                    </div>


                    <div class="product-meta">
                        ${product.category}
                    </div>


                    <div class="product-description">
                        ${product.description}
                    </div>


                    <div class="product-price">
                        ₹${product.price}
                    </div>


                    <div class="moq">
                        MOQ: ${product.moq} pcs
                    </div>


                    <button
                        class="
                            add-button
                            ${quantity > 0 ? "added" : ""}
                        "
                        onclick="
                            addToCart(${product.id})
                        "
                    >

                        ${
                            quantity > 0
                                ? `✓ ${quantity} in cart`
                                : "+ ADD TO CART"
                        }

                    </button>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(id) {

    if (!cart[id]) {

        const product =
            products.find(
                p =>
                    p.id === id
            );


        cart[id] =
            product.moq;

    }
    else {

        cart[id] += 1;

    }


    saveCart();

    renderProducts();

    updateCartBar();

    showToast(
        "Added to cart"
    );

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQuantity(
    id,
    change
) {

    if (!cart[id]) return;


    const product =
        products.find(
            p =>
                p.id === Number(id)
        );


    cart[id] += change;


    if (
        cart[id] <
        product.moq
    ) {

        cart[id] =
            product.moq;

    }


    saveCart();

    renderProducts();

    renderCart();

    updateCartBar();

}


/* =========================================================
   REMOVE
========================================================= */

function removeFromCart(id) {

    delete cart[id];

    saveCart();

    renderProducts();

    renderCart();

    updateCartBar();

}


/* =========================================================
   SAVE CART
========================================================= */

function saveCart() {

    localStorage.setItem(
        "kushiiCart",
        JSON.stringify(cart)
    );

}


/* =========================================================
   TOTAL
========================================================= */

function getCartTotal() {

    let total = 0;


    Object.keys(cart)
        .forEach(
            id => {

                const product =
                    products.find(
                        p =>
                            p.id ===
                            Number(id)
                    );


                if (product) {

                    total +=
                        product.price *
                        cart[id];

                }

            }
        );


    return total;

}


/* =========================================================
   ITEM COUNT
========================================================= */

function getCartItemCount() {

    return Object.values(cart)
        .reduce(
            (
                sum,
                qty
            ) =>
                sum + qty,
            0
        );

}


/* =========================================================
   CART BAR
========================================================= */

function updateCartBar() {

    document.getElementById(
        "cartItems"
    ).textContent =
        `${getCartItemCount()} items`;


    document.getElementById(
        "cartTotal"
    ).textContent =
        `₹${getCartTotal().toLocaleString("en-IN")}`;

}


/* =========================================================
   OPEN CART
========================================================= */

function openCart() {

    document
        .getElementById(
            "overlay"
        )
        .classList
        .add("show");


    document
        .getElementById(
            "cartDrawer"
        )
        .classList
        .add("open");


    renderCart();

}


/* =========================================================
   CLOSE CART
========================================================= */

function closeCart() {

    document
        .getElementById(
            "overlay"
        )
        .classList
        .remove("show");


    document
        .getElementById(
            "cartDrawer"
        )
        .classList
        .remove("open");

}


/* =========================================================
   RENDER CART
========================================================= */

function renderCart() {

    const container =
        document.getElementById(
            "cartItemsList"
        );


    container.innerHTML = "";


    const ids =
        Object.keys(cart);


    if (
        ids.length === 0
    ) {

        container.innerHTML = `

            <div
                style="
                    background: white;
                    padding: 50px 20px;
                    text-align: center;
                    border-radius: 12px;
                    box-shadow: var(--shadow);
                "
            >

                <h3>
                    Your cart is empty
                </h3>

                <p>
                    Browse the catalogue and
                    add products.
                </p>

            </div>

        `;

    }


    ids.forEach(
        id => {

            const product =
                products.find(
                    p =>
                        p.id ===
                        Number(id)
                );


            if (!product) return;


            const quantity =
                cart[id];


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "cart-item";


            item.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >


                <div
                    class="cart-item-details"
                >

                    <div
                        class="cart-item-name"
                    >
                        ${product.name}
                    </div>


                    <div
                        class="cart-item-price"
                    >
                        ₹${product.price} each
                    </div>


                    <div
                        class="quantity-control"
                    >

                        <button
                            onclick="
                                changeQuantity(
                                    ${product.id},
                                    -1
                                )
                            "
                        >
                            −
                        </button>


                        <span>
                            ${quantity}
                        </span>


                        <button
                            onclick="
                                changeQuantity(
                                    ${product.id},
                                    1
                                )
                            "
                        >
                            +
                        </button>

                    </div>


                    <button
                        class="remove"
                        onclick="
                            removeFromCart(
                                ${product.id}
                            )
                        "
                    >
                        Remove
                    </button>

                </div>


                <strong>

                    ₹${(
                        product.price *
                        quantity
                    ).toLocaleString("en-IN")}

                </strong>

            `;


            container.appendChild(
                item
            );

        }
    );


    document.getElementById(
        "drawerTotal"
    ).textContent =
        `₹${getCartTotal().toLocaleString("en-IN")}`;

}


/* =========================================================
   WHATSAPP ORDER
========================================================= */

function sendWhatsAppOrder() {

    const ids =
        Object.keys(cart);


    if (
        ids.length === 0
    ) {

        alert(
            "Please add products to your cart first."
        );

        return;

    }


    let message =
        `*KUSHII GIFTS - WHOLESALE ORDER*\n\n`;


    message +=
        `Hello Kushii Gifts,\n\n`;


    message +=
        `I would like to enquire/order the following products:\n\n`;


    let total = 0;


    ids.forEach(
        id => {

            const product =
                products.find(
                    p =>
                        p.id ===
                        Number(id)
                );


            if (!product) return;


            const quantity =
                cart[id];


            const itemTotal =
                product.price *
                quantity;


            total +=
                itemTotal;


            message +=
                `• ${product.name}\n` +
                `  Qty: ${quantity}\n` +
                `  Price: ₹${product.price}\n` +
                `  Subtotal: ₹${itemTotal}\n\n`;

        }
    );


    message +=
        `*Estimated Total: ₹${total.toLocaleString("en-IN")}*\n\n`;


    message +=
        `Please confirm availability, final wholesale pricing and delivery details.\n\n`;


    message +=
        `Thank you.`;


    const phone =
        "918019093131";


    const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        1800
    );

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderProducts
    );


/* =========================================================
   INITIALISE
========================================================= */

renderCategories();

renderProducts();

updateCartBar();


</script>
